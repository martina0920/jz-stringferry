name: jz_stringferry
description: "J&Z 弦渡 · 音乐编曲吉他学习 App（佳宇 & 泽华）"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 路由
  go_router: ^14.2.0

  # 本地存储（和弦库 / 学习计划 / 打卡数据）
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # 网络（AI 助手调用大模型 API）
  dio: ^5.5.0

  # 音频（和弦试听 / 扒带播放）
  just_audio: ^0.9.39

  # 录音（扒带助手：本地导入 + 录音）
  record: ^7.1.1

  # 工具
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
