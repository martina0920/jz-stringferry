name: jz_stringferry
description: "J&Z 弦渡 · 音乐编曲吉他学习 App（佳宇 & 泽华）"
publish_to: "none"
version: 0.5.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 路由
  go_router: ^14.2.0

  # 本地存储（和弦库 / 学习计划 / 打卡数据）
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # v0.2 AI 为纯本地实现，无任何网络依赖；云端大模型 API 计划 v0.3 再引入。

  # 音频（和弦试听 / 扒带播放）
  just_audio: ^0.9.39

  # 录音（扒带助手：本地导入 + 录音）
  record: ^7.1.1

  # 工具
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^13.3.1

  # v0.4 云端识别（阿里百炼 Qwen-Omni，OpenAI 兼容 HTTP）
  http: ^1.2.0

  # v0.4 扒带：本地音频导入
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 单元测试在 Dart VM 上通过 ffi 使用内存 SQLite（不进生产包）
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/guitar/
    - assets/audio/piano/
    - assets/audio/ep/
    - assets/audio/eguitar/
    - assets/audio/bass/
    - assets/audio/drums/
